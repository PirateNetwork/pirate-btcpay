[workspace]
resolver = "2"
members = [
	'pirate-btcpay-walletd',
]
# pirate-unified-wallet is a nested submodule with its own separate
# workspace (crates/Cargo.toml); without this exclude, Cargo's implicit
# member discovery pulls its crates into this workspace instead of letting
# them resolve their `*.workspace = true` fields against their own root.
exclude = [
	'pirate-unified-wallet',
]

# pirate-btcpay-walletd depends (via path, across the pirate-unified-wallet
# submodule boundary) on pirate-wallet-service, whose dependency graph only
# compiles against these Pirate-specific forks. Cargo patches apply to the
# whole resolution for whichever workspace initiates the build, so this must
# mirror pirate-unified-wallet/crates/Cargo.toml's [patch.crates-io] table
# exactly, or the build will pull in incompatible upstream crates.
[patch.crates-io]
halo2_gadgets = { git = "https://github.com/PirateNetwork/halo2.git", rev = "261faaccd5a30c19bb8468600841a0dac305adf5" }
halo2_poseidon = { git = "https://github.com/PirateNetwork/halo2.git", rev = "261faaccd5a30c19bb8468600841a0dac305adf5" }
halo2_proofs = { git = "https://github.com/PirateNetwork/halo2.git", rev = "261faaccd5a30c19bb8468600841a0dac305adf5" }
orchard = { git = "https://github.com/PirateNetwork/orchard.git", rev = "c0545158b15259805e31ea1953867d6a507c08e4" }
sapling-crypto = { git = "https://github.com/piratenetwork/sapling-crypto.git", rev = "62fcf59a4d933244ee6280182c6cd3e5290e8a90" }
zcash_address = { git = "https://github.com/piratenetwork/librustzcash", rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
zcash_encoding = { git = "https://github.com/piratenetwork/librustzcash", rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
zcash_keys = { git = "https://github.com/piratenetwork/librustzcash", rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
zcash_primitives = { git = "https://github.com/piratenetwork/librustzcash", rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
zcash_proofs = { git = "https://github.com/piratenetwork/librustzcash", rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
zcash_protocol = { git = "https://github.com/piratenetwork/librustzcash", rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
zcash_transparent = { git = "https://github.com/piratenetwork/librustzcash", rev = "cc3c11cf57944fd56ec61674f6794f6f38fa43bf" }
